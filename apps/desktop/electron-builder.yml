appId: com.studianda.app
productName: Studianda
# 安装包文件名固定为 Studianda-Setup-<version>.exe：electron-updater 的 latest.yml 里
# path / files[0].url 都指向它，改名会导致旧版本找不到更新包；scripts/package.mjs 按此名校验。
artifactName: Studianda-Setup-${version}.${ext}
# 生成 electron-updater 2.16+ 格式的 latest.yml（不再写 electron-updater 1.x 的 sha2 字段）。
electronUpdaterCompatibility: '>= 2.16'
# 自动更新渠道：应用内更新从 GitHub Releases 读取 latest.yml 与安装包。
# owner / repo 必须显式写出：应用内更新只依赖安装包里的 resources/app-update.yml
# （由 scripts/package.mjs 按这段配置生成），不依赖仓库的 git remote。
# releaseType: draft 只影响 electron-builder 自己发布时建 draft；本仓库的 Release 由
# .github/workflows/release.yml 用 gh release create 创建，打包脚本始终带 --publish never。
publish:
  provider: github
  owner: SNLCC
  repo: studianda
  releaseType: draft
directories:
  output: release
files:
  - out/**/*
  - package.json
  - LICENSE
  - NOTICE
  - "!**/*.map"
  - "!**/*.test.*"
  - "!**/out/core/src/**"
  # 水印字体不随 pnpm deploy 的 out/core/assets 进 asar：canvas 原生模块（libfont）读不了
  # asar 内的虚拟路径，统一由 extraResources 放到 resources/assets/fonts 再读。
  - "!**/out/core/assets/**"
  - "!**/test/**"
  - "!**/tests/**"
  - "!**/docs/**"
  - "!**/benchmark/**"
  - "!**/benchmarks/**"
  - "!**/pdfjs-dist/standard_fonts/Liberation*"
  - "!**/pdfjs-dist/standard_fonts/LICENSE_LIBERATION"
  - "!**/pdfjs-dist/wasm/quickjs*"
  # @napi-rs/canvas 的其它平台可选依赖不应进入 Windows x64 安装包
  # （每个 24–38 MB；根 package.json 的 pnpm.supportedArchitectures 也会阻止安装）
  - "!**/@napi-rs/canvas-android-*/**"
  - "!**/@napi-rs/canvas-darwin-*/**"
  - "!**/@napi-rs/canvas-linux-*/**"
  - "!**/@napi-rs/canvas-win32-arm64-*/**"
extraResources:
  - from: ../../legal
    to: legal
  # Agent MCP bridge：单文件 ESM（含 SDK/zod/agent-core），由 DSH 以 Electron-as-node 拉起。
  - from: ../../packages/agent-bridge/dist/agent-bridge.mjs
    to: agent-bridge.mjs
  # 完整版《使用须知与隐私说明》随安装包分发；安装包与源码仓库各自保留完整文件。
  - from: ../../docs/USAGE-NOTICE.md
    to: legal/USAGE-NOTICE.md
  - from: ../../LICENSE
    to: LICENSE
  - from: ../../NOTICE
    to: NOTICE
  # 水印字体（Noto Sans CJK SC 的水印子集 TTF，约 11 KB，canvas 读不了 woff2）：
  # Core 是独立子进程，按 <resources>/assets/fonts/ 读取，见 packages/core/src/watermark.ts
  # 的 bundledWatermarkFont()。不要改成打包进 asar 的路径：原生 canvas 读不了 asar 内文件。
  - from: ../../packages/core/assets/fonts/StudiandaWatermark.ttf
    to: assets/fonts/StudiandaWatermark.ttf
  # 运行期窗口 / 任务栏图标（开卷版）；ico 给 Windows 用，png 作为其它平台/兜底。
  - from: build/icon-open.ico
    to: icon-open.ico
  - from: build/icon-open.png
    to: icon-open.png
asar: true
asarUnpack:
  - "**/*.node"
  - "**/@napi-rs/canvas/**"
  - "**/tesseract.js/**"
  - "**/tesseract.js-core/**"
win:
  executableName: Studianda
  # 安装包、卸载程序、安装后的 exe / 桌面快捷方式 / 开始菜单统一用「叠书版」；
  # 打开之后窗口与任务栏图标由 BrowserWindow.icon 换成「开卷版」（见 src/main/index.ts）。
  icon: build/icon.ico
  target:
    - nsis
nsis:
  license: build/INSTALLER-NOTICE.txt
  # WinShell 上游无许可文本，不能随包再分发。当前固定的 app-builder-lib 26.18.0 模板
  # 已不再调用该插件；scripts/patch-nsis-templates.mjs 作为幂等防回归，若模板再出现调用
  # 就改写为 build/nsis/aumid.nsh 的宏。见 build/nsis/aumid.nsh。
  include: nsis/aumid.nsh
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 勘读Studianda
mac:
  target:
    - dmg
  category: public.app-category.productivity

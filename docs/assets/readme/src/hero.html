<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>勘读 Studianda · Hero</title>
<link rel="stylesheet" href="common.css" />
<style>
  html, body { width: 1200px; height: 380px; }

  .page { position: relative; width: 1200px; height: 380px; overflow: hidden; }

  /* ---------- 右侧：青瓷弧形书页 ---------- */
  .arch-wrap { position: absolute; inset: 0; }
  .arch {
    position: absolute;
    top: 0; right: 0;
    width: 342px; height: 380px;
    border-radius: 100% 0 0 100% / 50% 0 0 50%;
    background: linear-gradient(184deg, #577963 0%, #4f6f5a 42%, #47634e 100%);
  }
  .arch::after {
    /* 弧面受光：左缘一条极淡的纸色高光 */
    content: "";
    position: absolute; inset: 0;
    border-radius: inherit;
    box-shadow: inset 3px 0 0 rgba(251, 247, 236, 0.10);
  }
  .ring {
    position: absolute; top: 0; right: 0; height: 380px;
    border-radius: 100% 0 0 100% / 50% 0 0 50%;
    border: 1px solid rgba(251, 247, 236, 0.20);
    border-right: none;
  }
  .ring.r1 { width: 342px; }
  .ring.r2 { width: 272px; border-color: rgba(251, 247, 236, 0.13); }
  .ring.r3 { width: 202px; border-color: rgba(251, 247, 236, 0.08); }

  .ribbon {
    position: absolute;
    top: -8px; right: 128px;
    width: 96px; height: 322px;
    filter: drop-shadow(0 7px 14px rgba(66, 30, 22, 0.20));
  }
  .arch-note {
    position: absolute;
    right: 37px; top: 108px;
    writing-mode: vertical-rl;
    font-family: var(--sans);
    font-size: 10px;
    letter-spacing: 0.34em;
    color: rgba(251, 247, 236, 0.46);
    white-space: nowrap;
  }

  /* ---------- 左侧：品牌信息 ---------- */
  .content { position: absolute; left: 72px; top: 48px; width: 640px; }

  .eyebrow {
    display: flex; align-items: center; gap: 9px;
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.24em;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .eyebrow .mark {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--vermilion);
  }
  .eyebrow .tick {
    width: 26px; height: 1px; background: var(--line-strong);
  }

  .lockup { display: flex; align-items: center; margin-top: 17px; }
  .mark-img {
    width: 92px; height: 92px;
    display: block;
    border-radius: 22px;
  }
  .names { margin-left: 22px; }
  .cn {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 62px;
    line-height: 1.02;
    letter-spacing: 0.06em;
    color: var(--ink);
  }
  .en {
    margin-top: 7px;
    font-family: var(--serif-latin);
    font-weight: 600;
    font-size: 18px;
    line-height: 1;
    letter-spacing: 0.30em;
    color: var(--celadon);
  }

  .tagline {
    margin-top: 19px;
    font-family: var(--kai);
    font-size: 27px;
    line-height: 1.3;
    letter-spacing: 0.08em;
    color: #454237;
  }

  .value {
    margin-top: 11px;
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.56;
    letter-spacing: 0.01em;
    color: var(--ink-soft);
  }
  .value .sep { color: var(--line-strong); padding: 0 2px; }

  .pills {
    position: absolute;
    left: 72px; bottom: 39px;
    display: flex; gap: 9px;
  }

  /* 页脚细线：压在左下，像书页地脚 */
  .foot-rule {
    position: absolute;
    left: 72px; bottom: 26px;
    width: 640px; height: 1px;
    background: linear-gradient(90deg, var(--page) 0%, rgba(226, 215, 195, 0) 100%);
  }
</style>
</head>
<body class="paper">
  <div class="page">
    <div class="arch-wrap">
      <div class="arch"></div>
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <div class="ring r3"></div>
      <div class="arch-note">数据默认留在本机</div>
      <svg class="ribbon" viewBox="0 0 80 300" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="ribbonGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#b23b2e" />
            <stop offset="0.62" stop-color="#b23b2e" />
            <stop offset="1" stop-color="#cb705c" />
          </linearGradient>
        </defs>
        <path
          d="M33 0
             C25 46 21 78 31 116
             C41 154 45 190 37 232
             L31 272 L39.5 256 L48 274 L50 232
             C58 190 54 154 44 116
             C34 78 40 46 47 0 Z"
          fill="url(#ribbonGrad)"
        />
      </svg>
    </div>

    <div class="content">
      <div class="eyebrow"><span class="mark"></span>本地优先 · 人文社科 · 学术阅读<span class="tick"></span></div>

      <div class="lockup">
        <img class="mark-img" src="../../../brand/icon-open-512.png" alt="勘读 Studianda 图标" />
        <div class="names">
          <div class="cn">勘读</div>
          <div class="en">STUDIANDA</div>
        </div>
      </div>

      <div class="tagline">本地优先的人文社科学术空间</div>

      <div class="value">
        按范围精读<span class="sep">·</span>逐字核验<span class="sep">·</span>引用回原文<br />
        翻译、批注、笔记与扫描件 OCR，都在同一个窗口完成。
      </div>
    </div>

    <div class="pills">
      <span class="pill"><span class="dot"></span>AI 精读</span>
      <span class="pill"><span class="dot"></span>引用可回溯</span>
      <span class="pill accent"><span class="dot"></span>本地存储</span>
      <span class="pill"><span class="dot"></span>扫描件 OCR</span>
    </div>
    <div class="foot-rule"></div>
  </div>
</body>
</html>
